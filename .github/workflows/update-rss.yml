name: 自动更新RSS订阅源

on:
  schedule:
    # 每6小时运行一次
    - cron: '0 */6 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: 更新CFR RSS
      run: |
        python3 rss_generator.py 'https://www.cfr.org/' '.content-item' '.title a' '.title a' '.summary'
        echo "CFR RSS 更新完成"
    
    - name: 更新CSIS RSS
      run: |
        python3 rss_generator.py 'https://www.csis.org/' '.post-item' '.post-title a' '.post-title a' '.post-excerpt'
        echo "CSIS RSS 更新完成"
    
    - name: 更新BU GDP RSS
      run: |
        python3 rss_generator.py bu-gdp
        echo "BU GDP RSS 更新完成"
    
    - name: 检查文件变化
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "检测到文件变化"
          git status --porcelain
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "没有检测到文件变化"
        fi
    
    - name: 提交更改
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.xml
        git commit -m "Auto-update RSS feeds - $(date '+%Y-%m-%d_%H:%M:%S')"
        git push
        echo "RSS文件已自动更新并提交"
    
    - name: 显示更新结果
      run: |
        echo "=== RSS更新结果 ==="
        ls -la *.xml
        echo "=================="
