name: 自动更新RSS订阅源

on:
  schedule:
    # 每天运行两次（北京时间 06:00 和 18:00）
    # 北京时间 = UTC+8，所以需要提前8小时
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间次日 06:00
    - cron: '0 10 * * *'  # UTC 10:00 = 北京时间 18:00
  workflow_dispatch: # 允许手动触发

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
    
    - name: 更新CFR RSS
      run: |
        python3 rss_generator.py 'https://www.cfr.org/' 'article' 'h3' 'a' 'p'
        echo "CFR RSS 更新完成"
    
    - name: 更新CFR经济学RSS
      run: |
        python3 rss_generator.py cfr-economics
        echo "CFR经济学RSS 更新完成"
    
    - name: 更新CSIS RSS
      run: |
        python3 rss_generator.py 'https://www.csis.org/' 'article' 'h3' 'a[class*="headline"]' 'p'
        echo "CSIS RSS 更新完成"
    
    - name: 更新BU GDP RSS
      run: |
        python3 rss_generator.py bu-gdp
        echo "BU GDP RSS 更新完成"
    
    - name: 检查文件变化
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "检测到文件变化"
          git status --porcelain
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "没有检测到文件变化"
        fi
    
    - name: 提交更改
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git config --local --add safe.directory $GITHUB_WORKSPACE
        git add *.xml
        git commit -m "Auto-update RSS feeds - $(date '+%Y-%m-%d_%H:%M:%S')" || echo "No changes to commit"
        git push origin HEAD:main || echo "Push failed, but continuing"
        echo "RSS文件已自动更新并提交"
    
    - name: 显示更新结果
      run: |
        echo "=== RSS更新结果 ==="
        ls -la *.xml
        echo "=================="
